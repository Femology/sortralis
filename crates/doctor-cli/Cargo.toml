[package]
name = "doctor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pre-alpha command-line scaffold for Sortralis"
default-run = "sortralis"

[[bin]]
name = "sortralis"
path = "src/main.rs"

[[bin]]
name = "sud"
path = "src/sud.rs"

[[test]]
name = "cli"
path = "../../tests/cli/help.rs"

[dependencies]
clap.workspace = true
doctor-core = { path = "../doctor-core" }
semver.workspace = true
doctor-source = { path = "../doctor-source" }
doctor-cargo = { path = "../doctor-cargo" }
doctor-runner = { path = "../doctor-runner" }
doctor-report = { path = "../doctor-report" }
serde_json.workspace = true
doctor-git = { path = "../doctor-git" }
doctor-wasm = { path = "../doctor-wasm" }
serde.workspace = true
toml.workspace = true

tempfile.workspace = true

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/doctor-cli",
    "crates/doctor-core",
    "crates/doctor-cargo",
    "crates/doctor-source",
    "crates/doctor-wasm",
    "crates/doctor-runner",
    "crates/doctor-report",
    "crates/doctor-git",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
semver = "=1.0.28"
cargo_metadata = "=0.23.1"
syn = { version = "=3.0.6", default-features = false, features = ["full", "parsing", "visit", "printing"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
tempfile = "=3.27.0"
nix = { version = "=0.31.3", features = ["signal", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

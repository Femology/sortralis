[workspace]
resolver = "2"
members = [
    "crates/doctor-cli",
    "crates/doctor-core",
    "crates/doctor-cargo",
    "crates/doctor-source",
    "crates/doctor-wasm",
    "crates/doctor-runner",
    "crates/doctor-report",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

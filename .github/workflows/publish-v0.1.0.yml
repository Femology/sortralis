name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: version
        name: Validate one-time v0.1.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              data = tomllib.load(handle)
          print(data["workspace"]["package"]["version"])
          PY
          )"
          test "$VERSION" = "0.1.0"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
            archive: tar
          - os: macos-latest
            asset: macos-arm64
            archive: tar
          - os: macos-15-intel
            asset: macos-x86_64
            archive: tar
          - os: windows-latest
            asset: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install verified Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build locked release binaries
        run: cargo build --release --locked -p doctor-cli --bins

      - name: Run full workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Smoke-test Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/release/sortralis --version
          ./target/release/sortralis --help
          ./target/release/sud --version
          ./target/release/sud --help

      - name: Smoke-test Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\release\sortralis.exe --version
          .\target\release\sortralis.exe --help
          .\target\release\sud.exe --version
          .\target\release\sud.exe --help

      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          NAME="sortralis-v${VERSION}-${{ matrix.asset }}"
          mkdir -p "dist/$NAME"
          cp target/release/sortralis target/release/sud LICENSE README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -rf "dist/$NAME"
          shasum -a 256 "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $name = "sortralis-v$version-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item "target\release\sortralis.exe" "dist\$name\"
          Copy-Item "target\release\sud.exe" "dist\$name\"
          Copy-Item "LICENSE" "dist\$name\"
          Copy-Item "README.md" "dist\$name\"
          $archive = "dist\$name.zip"
          Compress-Archive -Path "dist\$name\*" -DestinationPath $archive
          Remove-Item -Recurse -Force "dist\$name"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 4

      - name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"
          TAG_OBJECT_SHA="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags"             -f tag="$TAG"             -f message="Sortralis $TAG"             -f object="$GITHUB_SHA"             -f type="commit"             -f 'tagger[name]=github-actions[bot]'             -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com'             -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"             -f ref="refs/tags/$TAG"             -f sha="$TAG_OBJECT_SHA"
          gh release create "$TAG" dist/*             --verify-tag             --title "Sortralis $TAG"             --notes-file docs/releases/v0.1.0.md

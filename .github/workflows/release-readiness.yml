name: Release Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tests/**"
      - ".github/workflows/release-readiness.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tests/**"
      - ".github/workflows/release-readiness.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install verified Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0

      - name: Build release binaries
        run: cargo build --release --locked -p doctor-cli --bins

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Smoke-test binaries on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/release/sortralis --version
          ./target/release/sortralis --help
          ./target/release/sud --version
          ./target/release/sud --help

      - name: Smoke-test binaries on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\release\sortralis.exe --version
          .\target\release\sortralis.exe --help
          .\target\release\sud.exe --version
          .\target\release\sud.exe --help
